name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

env:
  KEELMATRIX_NO_TELEMETRY: "1"

jobs:
  validate:
    name: Validate (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-latest
          - ubuntu-latest
          - macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.400

      - name: Derive package version
        id: package-version
        shell: pwsh
        run: |
          $version = (& pwsh -NoProfile -File scripts/GetReleaseVersion.ps1 -Tag v0.1.0 | Out-String).Trim()
          if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace($version)) {
            throw "Could not derive the CI package version."
          }
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Verify release version and workflow contract
        shell: pwsh
        run: pwsh -NoProfile -File tests/VerifyReleaseVersionContract.ps1

      - name: Verify release publication contract
        shell: pwsh
        run: pwsh -NoProfile -File tests/VerifyReleaseWorkflowContract.ps1

      - name: Verify changelog finalization contract
        shell: pwsh
        run: pwsh -NoProfile -File tests/VerifyChangelogContract.ps1

      - name: Verify history hygiene contract
        shell: pwsh
        run: pwsh -NoProfile -File tests/VerifyHistoryHygieneContract.ps1

      - name: Verify vulnerability audit contract (Ubuntu)
        if: matrix.os == 'ubuntu-latest'
        shell: pwsh
        run: pwsh -NoProfile -File tests/VerifyVulnerabilityAuditContract.ps1

      - name: Configure macOS temporary directory
        if: runner.os == 'macOS'
        shell: bash
        run: |
          temp_directory="$RUNNER_TEMP/hookreplay"
          mkdir -p "$temp_directory"
          echo "TMPDIR=$temp_directory/" >> "$GITHUB_ENV"

      - name: Restore
        run: dotnet restore KeelMatrix.HookReplay.sln --configfile NuGet.config

      - name: Build shipping project for net8.0
        run: dotnet build src/KeelMatrix.HookReplay/KeelMatrix.HookReplay.csproj --configuration Release --no-restore --framework net8.0 -p:Version=${{ steps.package-version.outputs.version }}

      - name: Build shipping project for netstandard2.0
        run: dotnet build src/KeelMatrix.HookReplay/KeelMatrix.HookReplay.csproj --configuration Release --no-restore --framework netstandard2.0 -p:Version=${{ steps.package-version.outputs.version }}

      - name: Build tests
        run: dotnet build tests/KeelMatrix.HookReplay.Tests/KeelMatrix.HookReplay.Tests.csproj --configuration Release --no-restore -p:Version=${{ steps.package-version.outputs.version }}

      - name: Test
        env:
          KEELMATRIX_NO_TELEMETRY: "1"
        run: dotnet test KeelMatrix.HookReplay.sln --configuration Release --no-build -p:Version=${{ steps.package-version.outputs.version }}

      - name: Verify cassette determinism
        env:
          KEELMATRIX_NO_TELEMETRY: "1"
        run: >
          dotnet test tests/KeelMatrix.HookReplay.Tests/KeelMatrix.HookReplay.Tests.csproj
          --configuration Release
          --no-build
          -p:Version=${{ steps.package-version.outputs.version }}
          --filter "FullyQualifiedName~Cassette_is_deterministic_and_does_not_persist_secrets"

      # Keep one canonical format gate because checkout line endings differ by platform.
      - name: Verify formatting and analyzers (Ubuntu)
        if: matrix.os == 'ubuntu-latest'
        run: dotnet format KeelMatrix.HookReplay.sln --verify-no-changes

      - name: Check for vulnerable dependencies
        if: matrix.os == 'ubuntu-latest'
        shell: pwsh
        run: pwsh -NoProfile -File scripts/CheckVulnerabilities.ps1 -SolutionPath KeelMatrix.HookReplay.sln -NuGetConfig NuGet.config

      - name: Pack
        run: >
          dotnet pack src/KeelMatrix.HookReplay/KeelMatrix.HookReplay.csproj
          --configuration Release
          --no-build
          --include-symbols
          -p:SymbolPackageFormat=snupkg
          -p:Version=${{ steps.package-version.outputs.version }}
          --output ./artifacts/packages

      - name: Inspect package artifacts
        shell: pwsh
        run: pwsh -NoProfile -File scripts/InspectPackage.ps1 -PackageDirectory ./artifacts/packages -Version ${{ steps.package-version.outputs.version }} -ExpectedCommit "${{ github.sha }}"

      - name: Run package consumer smoke
        env:
          KEELMATRIX_NO_TELEMETRY: "1"
        shell: pwsh
        run: pwsh -NoProfile -File tests/RunPackageConsumerSmoke.ps1

      - name: Upload package artifacts
        uses: actions/upload-artifact@v7
        with:
          name: packages-${{ matrix.os }}
          path: ./artifacts/packages
          if-no-files-found: error
