name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

env:
  KEELMATRIX_NO_TELEMETRY: "1"

jobs:
  validate-release:
    outputs:
      version: ${{ steps.release-version.outputs.version }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.400

      - name: Validate release tag
        id: release-version
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $version = (& pwsh -NoProfile -File scripts/GetReleaseVersion.ps1 -Tag $env:RELEASE_TAG | Out-String).Trim()
          if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace($version)) {
            throw "Could not derive a release version from the tag."
          }
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Restore from nuget.org
        run: dotnet restore KeelMatrix.HookReplay.sln --configfile NuGet.config --no-cache --force

      - name: Check for vulnerable dependencies
        shell: pwsh
        run: pwsh -NoProfile -File scripts/CheckVulnerabilities.ps1 -SolutionPath KeelMatrix.HookReplay.sln -NuGetConfig NuGet.config

      - name: Build Release
        run: dotnet build KeelMatrix.HookReplay.sln --configuration Release --no-restore -p:Version=${{ steps.release-version.outputs.version }}

      - name: Test Release
        run: dotnet test KeelMatrix.HookReplay.sln --configuration Release --no-build -p:Version=${{ steps.release-version.outputs.version }}

      - name: Pack expected artifacts
        run: >
          dotnet pack src/KeelMatrix.HookReplay/KeelMatrix.HookReplay.csproj
          --configuration Release
          --no-build
          --include-symbols
          -p:SymbolPackageFormat=snupkg
          -p:Version=${{ steps.release-version.outputs.version }}
          --output ./artifacts/packages

      - name: Inspect package artifacts before publication
        shell: pwsh
        run: >
          pwsh -NoProfile -File scripts/InspectPackage.ps1
          -PackageDirectory ./artifacts/packages
          -Version ${{ steps.release-version.outputs.version }}
          -ExpectedCommit "${{ github.sha }}"

      - name: Validate release artifact set
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ steps.release-version.outputs.version }}
        run: |
          $version = $env:RELEASE_VERSION
          $expected = @(
            "KeelMatrix.HookReplay.$version.nupkg",
            "KeelMatrix.HookReplay.$version.snupkg"
          ) | Sort-Object
          $actual = @(Get-ChildItem -LiteralPath ./artifacts/packages -File | Select-Object -ExpandProperty Name | Sort-Object)
          if ((Compare-Object $expected $actual) -ne $null) {
            throw "Unexpected release artifact set. Expected: $($expected -join ', '). Actual: $($actual -join ', ')."
          }

      - name: Upload validated release artifacts
        uses: actions/upload-artifact@v7
        with:
          name: nuget-release-packages
          path: |
            ./artifacts/packages/KeelMatrix.HookReplay.${{ steps.release-version.outputs.version }}.nupkg
            ./artifacts/packages/KeelMatrix.HookReplay.${{ steps.release-version.outputs.version }}.snupkg
          if-no-files-found: error

  publish:
    needs: validate-release
    runs-on: ubuntu-latest
    permissions:
      actions: read
      id-token: write
    steps:
      - name: Download validated release artifacts
        uses: actions/download-artifact@v7
        with:
          name: nuget-release-packages
          path: ./artifacts/packages

      - name: Validate downloaded artifact set
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ needs.validate-release.outputs.version }}
        run: |
          $version = $env:RELEASE_VERSION
          if ([string]::IsNullOrWhiteSpace($version)) {
            throw "The validation job did not provide a release version."
          }

          $expected = @(
            "KeelMatrix.HookReplay.$version.nupkg",
            "KeelMatrix.HookReplay.$version.snupkg"
          ) | Sort-Object
          $actual = @(Get-ChildItem -LiteralPath ./artifacts/packages -File | Select-Object -ExpandProperty Name | Sort-Object)
          if ((Compare-Object $expected $actual) -ne $null) {
            throw "Unexpected downloaded release artifact set. Expected: $($expected -join ', '). Actual: $($actual -join ', ')."
          }

      - name: Authenticate to NuGet.org
        id: nuget-login
        uses: NuGet/login@v1
        with:
          user: dmitriyzen

      - name: Publish the expected package
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ needs.validate-release.outputs.version }}
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
        run: |
          dotnet nuget push "./artifacts/packages/KeelMatrix.HookReplay.$env:RELEASE_VERSION.nupkg" `
            --source https://api.nuget.org/v3/index.json `
            --api-key $env:NUGET_API_KEY
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }
