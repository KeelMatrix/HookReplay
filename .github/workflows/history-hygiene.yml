name: Commit history hygiene

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  commit-history:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch all refs
        shell: bash
        run: git fetch --all --tags --prune

      - name: Check all reachable commits
        shell: bash
        run: |
          sh .githooks/check-history
