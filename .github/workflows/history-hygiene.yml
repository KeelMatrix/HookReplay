name: Commit history hygiene

on:
  push:
    branches:
      - '**'
  pull_request:

permissions:
  contents: read

jobs:
  commit-history:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Refresh remote branches
        shell: bash
        run: git fetch --all --prune

      - name: Check all reachable commits
        shell: bash
        run: |
          sh .githooks/check-history
